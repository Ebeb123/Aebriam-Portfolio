<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/previews/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Aebriam C. Lawas</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />

    <!-- Link preview (Messenger, Facebook, LinkedIn, Discord, X). %SITE_...% values are filled in from siteContent.ts at build time.
         If your web address changes, update the 3 URLs below. -->
    <link rel="canonical" href="https://aebriam.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_NAME% · Portfolio" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="https://aebriam.vercel.app/" />
    <meta property="og:image" content="https://aebriam.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SITE_NAME%, %SITE_ROLE%" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: IBM Plex Sans + IBM Plex Mono are bundled from npm (@fontsource), no Google request -->

    <!-- Apply saved theme before first paint (no white flash in dark mode) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
