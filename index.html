<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Aebriam C. Lawas</title>
    <meta name="description" content="Portfolio of Aebriam C. Lawas, BS Information Technology student focused on cybersecurity." />

    <!-- Fonts: IBM Plex Sans + IBM Plex Mono are bundled from npm (@fontsource), no Google request -->

    <!-- Apply saved theme before first paint (no white flash in dark mode) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
